<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f5f5ef">
	<title>Folha | Scanner de documentos</title>
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
</head>
<body>
	<main class="app-shell">
		<header class="topbar">
			<a class="brand" href="#inicio" aria-label="Folha, início">
				<span class="brand-mark" aria-hidden="true">f.</span>
				<span>folha</span>
			</a>
			<span class="version">SCANNER <span>01</span></span>
		</header>

		<section class="scanner" id="inicio" aria-labelledby="page-title">
			<div class="intro">
				<p class="eyebrow">SEU ARQUIVO, EM ORDEM</p>
				<h1 id="page-title">Um lugar para<br><span>cada documento.</span></h1>
				<p class="subheading">Comece com uma foto nítida. O resto fica por aqui.</p>
			</div>

			<div class="preview-frame" id="preview-frame">
				<div class="empty-state" id="empty-state">
					<div class="paper-icon" aria-hidden="true">
						<span></span><span></span><span></span>
					</div>
					<p class="empty-title">Sua próxima digitalização</p>
					<p class="empty-hint">A imagem aparece aqui</p>
				</div>
				<img class="preview-image" id="preview-image" alt="Prévia do documento selecionado" hidden>
				<span class="preview-tag" id="preview-tag" hidden>PRÉVIA</span>
				<span class="corner corner-tl" aria-hidden="true"></span>
				<span class="corner corner-tr" aria-hidden="true"></span>
				<span class="corner corner-bl" aria-hidden="true"></span>
				<span class="corner corner-br" aria-hidden="true"></span>
			</div>

			<label class="filename-field" for="filename">
				<span>NOME DO ARQUIVO</span>
				<input id="filename" type="text" value="documento" autocomplete="off" spellcheck="false" disabled>
				<span class="file-extension" id="file-extension">—</span>
			</label>

			<div class="actions">
				<button class="button button-primary" id="scan-button" type="button">
					<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 12h8M12 8v8"/></svg>
					Escanear documento
				</button>
				<div class="secondary-actions">
					<button class="button button-secondary" id="photo-button" type="button">
						<svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="m8 5 1-2h6l1 2"/></svg>
						Abrir foto
					</button>
					<button class="button button-secondary" id="retake-button" type="button" disabled>
						<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5"/></svg>
						Refazer
					</button>
				</div>
				<button class="button button-save" id="save-button" type="button" disabled>
					Salvar imagem
					<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 17v3h16v-3"/></svg>
				</button>
			</div>

			<p class="privacy-note"><span aria-hidden="true"></span>Suas imagens ficam neste dispositivo.</p>
			<p class="status-message" id="status-message" role="status" aria-live="polite"></p>
		</section>

		<footer class="footer"><span>FOLHA DOCUMENTOS</span><span>V0.1</span></footer>
	</main>

	<input class="visually-hidden" id="camera-input" type="file" accept="image/*" capture="environment" aria-label="Capturar documento com a câmera">
	<input class="visually-hidden" id="photo-input" type="file" accept="image/*" aria-label="Escolher foto do dispositivo">
</body>
</html>
